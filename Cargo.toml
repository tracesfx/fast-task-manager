[package]
name = "fast-task-manager"
version = "0.1.0"
edition = "2021"
description = "A fast, lightweight task manager for Windows"

[dependencies]
eframe = "0.31"
egui_extras = "0.31"
# Only the process/CPU/memory module; no rayon thread pool ("multithread"),
# no disks/networks/components/users.
sysinfo = { version = "0.34", default-features = false, features = ["system"] }
# Process actions (end process, set priority) and GPU counters. Already in the
# dependency tree via winit.
windows-sys = { version = "0.59", features = [
    "Win32_Foundation",
    "Win32_System_Threading",
    # GPU usage via PDH performance counters.
    "Win32_System_Performance",
] }

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true
