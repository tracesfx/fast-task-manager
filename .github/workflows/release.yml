# Builds the release exe (Smart App Control blocks release builds locally), wraps
# it in an Inno Setup installer and a portable zip, and attaches both to a
# GitHub Release. Trigger: push a tag like v0.1.0, or run it manually to just
# get the artifacts. The files are unsigned; sign them before the "Upload" step
# once a certificate or Azure Trusted Signing account exists.
name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  package:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Build
        run: cargo build --release --locked

      - name: Version
        id: ver
        shell: pwsh
        run: |
          $v = (Select-String -Path Cargo.toml -Pattern '^version = "(.+)"').Matches[0].Groups[1].Value
          if ($env:GITHUB_REF_TYPE -eq 'tag' -and $env:GITHUB_REF_NAME -ne "v$v") {
            throw "Tag $env:GITHUB_REF_NAME does not match Cargo.toml version $v"
          }
          "version=$v" >> $env:GITHUB_OUTPUT

      - name: Installer
        shell: pwsh
        run: |
          if (-not (Get-Command iscc -ErrorAction SilentlyContinue)) { choco install innosetup -y --no-progress }
          $iscc = (Get-Command iscc -ErrorAction SilentlyContinue).Source
          if (-not $iscc) { $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" }
          & $iscc "/DAppVersion=${{ steps.ver.outputs.version }}" installer\fast-task-manager.iss
          if ($LASTEXITCODE -ne 0) { throw "iscc failed" }

      - name: Portable zip
        shell: pwsh
        run: |
          Compress-Archive -Path target\release\fast-task-manager.exe `
            -DestinationPath "dist\fast-task-manager-${{ steps.ver.outputs.version }}-portable.zip"

      - name: Checksums
        shell: pwsh
        run: |
          Get-ChildItem dist | ForEach-Object {
            "$((Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLower())  $($_.Name)"
          } | Set-Content dist\SHA256SUMS.txt

      - uses: actions/upload-artifact@v4
        with:
          name: fast-task-manager-${{ steps.ver.outputs.version }}
          path: dist/*

      - name: Publish release
        if: github.ref_type == 'tag'
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
